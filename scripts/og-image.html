<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Planetary Escape social preview</title>
    <style>
      @font-face {
        font-family: Basement;
        src: url("../public/fonts/BSBlack.woff2") format("woff2");
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        padding: 60px;
        background: #1e1e1e;
        color: #e7e7d8;
        font-family: Arial, sans-serif;
      }
      main {
        height: 100%;
        padding: 40px;
        border: 1px solid #e7e7d833;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-image: linear-gradient(#e7e7d808 1px, transparent 1px),
          linear-gradient(90deg, #e7e7d808 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .eyebrow { color: #e8a33d; font-size: 18px; letter-spacing: 3px; }
      h1 {
        margin: 0 0 20px;
        font-family: Basement, Arial, sans-serif;
        font-size: 88px;
        line-height: 1.05;
        text-transform: uppercase;
      }
      p { margin: 0; }
      .subtitle { color: #afac95; font-size: 28px; }
      footer { font-size: 20px; display: flex; justify-content: space-between; }
      .arrow { color: #e8a33d; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">BUILD. SHIP. COLLABORATE.</p>
      <div>
        <h1>Planetary<br />Escape</h1>
        <p class="subtitle">Software Services Network</p>
      </div>
      <footer><span>planetaryescape.co.za</span><span class="arrow">↗</span></footer>
    </main>
  </body>
</html>
